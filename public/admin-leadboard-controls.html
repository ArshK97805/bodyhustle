<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Leaderboard Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .profile-pic { width:40px; height:40px; border-radius:50%; margin-right:8px; }
  </style>
</head>
<body class="p-4">
  <h3 class="text-center text-primary fw-bold">⚙️ Admin Leaderboard Control</h3>

  <div class="d-flex justify-content-center mt-3">
    <select id="tournamentSelect" class="form-select w-50">
      <option value="">Select Tournament</option>
    </select>
    <button class="btn btn-warning ms-2" onclick="postpone()">Postpone</button>
    <button class="btn btn-danger ms-2" onclick="resetLeaderboard()">Reset Leaderboard</button>
  </div>

  <table class="table table-hover mt-4">
    <thead class="table-dark">
      <tr>
        <th>Player</th><th>Game</th><th>Wins</th><th>Losses</th><th>Draws</th><th>Total</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>

  <script>
    async function loadTournaments() {
      let res = await fetch("/events"); // Create an API that fetches events
      let data = await res.json();
      let select = document.getElementById("tournamentSelect");
      data.forEach(ev => {
        let opt = document.createElement("option");
        opt.value = ev.rid;
        opt.textContent = ev.event + " (" + ev.sports + ")";
        select.appendChild(opt);
      });
    }

    async function loadLeaderboard() {
      let tid = document.getElementById("tournamentSelect").value;
      if (!tid) return;
      let res = await fetch(`/leaderboard/${tid}`);
      let data = await res.json();
      let tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = "";
      data.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${row.profilepic}" class="profile-pic"> ${row.name}</td>
            <td>${row.sports}</td>
            <td>${row.wins}</td>
            <td>${row.losses}</td>
            <td>${row.draws}</td>
            <td>${row.total}</td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="editResult(${row.email})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="removeResult(${row.email})">Remove</button>
            </td>
          </tr>
        `;
      });
    }

    function resetLeaderboard() {
      let tid = document.getElementById("tournamentSelect").value;
      if (!tid) return alert("Select a tournament");
      fetch(`/leaderboard/${tid}/reset`, { method: "DELETE" })
        .then(() => loadLeaderboard());
    }

    function postpone() {
      alert("Tournament postponed (this would update events table)");
    }

    function editResult(id) {
      let result = prompt("Enter new result (win/loss/draw):");
      if (!result) return;
      fetch(`/leaderboard/result/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ result })
      }).then(() => loadLeaderboard());
    }

    function removeResult(id) {
      fetch(`/leaderboard/result/${id}`, { method: "DELETE" })
        .then(() => loadLeaderboard());
    }

    document.getElementById("tournamentSelect").addEventListener("change", loadLeaderboard);
    loadTournaments();
  </script>
</body>
</html>
