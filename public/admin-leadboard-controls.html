<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard - Admin Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .profile-pic {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }
    .leaderboard-card {
      max-width: 1000px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container my-4">
    <h2 class="text-center fw-bold mb-4">🏆 Leaderboard (Admin Controls)</h2>

    <!-- Event Dropdown -->
    <div class="row mb-3">
      <div class="col-md-4 mx-auto">
        <select id="eventDropdown" class="form-select">
          <option value="">Select Event</option>
        </select>
      </div>
    </div>

    <!-- Leaderboard Table -->
    <div id="leaderboard" class="leaderboard-card card shadow-sm">
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Game</th>
              <th>Wins</th>
              <th>Losses</th>
              <th>Draws</th>
              <th>Total</th>
              <th>Actions</th> <!-- Admin Controls -->
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Load Events into Dropdown
    fetch("/events")
      .then(res => res.json())
      .then(events => {
        const eventDropdown = document.getElementById("eventDropdown");
        events.forEach(ev => {
          const opt = document.createElement("option");
          opt.value = ev.rid;
          opt.textContent = `${ev.event} (${ev.sports})`;
          eventDropdown.appendChild(opt);
        });
      });

    // Load Leaderboard for Selected Event
    function loadLeaderboard(eventId) {
      if (!eventId) {
        document.getElementById("leaderboardBody").innerHTML = "";
        return;
      }

      fetch(`/leaderboard?eventId=${eventId}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("leaderboardBody");
          tbody.innerHTML = "";
          data.forEach((player, index) => {
            const row = `
              <tr>
                <td>${index + 1}</td>
                <td>
                  <img src="${player.profilepic || 'default-pic.png'}" class="profile-pic me-2">
                  ${player.name}
                </td>
                <td>${player.games || '-'}</td>
                <td>${player.wins || 0}</td>
                <td>${player.losses || 0}</td>
                <td>${player.draws || 0}</td>
                <td>${player.total_games || 0}</td>
                <td>
                  <button class="btn btn-sm btn-warning" onclick="editPlayer('${player.id}')">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="deletePlayer('${player.id}')">Delete</button>
                </td>
              </tr>
            `;
            tbody.innerHTML += row;
          });
        });
    }

    // Event Dropdown Change
    document.getElementById("eventDropdown").addEventListener("change", function() {
      loadLeaderboard(this.value);
    });

    // Admin Edit Function
    function editPlayer(playerId) {
      const newWins = prompt("Enter updated Wins:");
      const newLosses = prompt("Enter updated Losses:");
      const newDraws = prompt("Enter updated Draws:");

      fetch(`/update-player`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: playerId, wins: newWins, losses: newLosses, draws: newDraws })
      })
      .then(res => res.json())
      .then(resp => {
        alert(resp.message);
        loadLeaderboard(document.getElementById("eventDropdown").value);
      });
    }

    // Admin Delete Function
    function deletePlayer(playerId) {
      if (!confirm("Are you sure you want to delete this player from leaderboard?")) return;

      fetch(`/delete-player/${playerId}`, { method: "DELETE" })
        .then(res => res.json())
        .then(resp => {
          alert(resp.message);
          loadLeaderboard(document.getElementById("eventDropdown").value);
        });
    }
  </script>
</body>
</html>
