<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .profile-pic {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }
    .leaderboard-card { max-width: 900px; margin: auto; }
  </style>
</head>
<body>
  <div class="container my-4">
    <h2 class="text-center fw-bold mb-4">🏆 Leaderboard</h2>

    <!-- Filters -->
    <div class="row mb-3">
      <!-- Event Dropdown -->
      <div class="col-md-4">
        <select id="eventDropdown" class="form-select"></select>
      </div>

      <!-- Game Dropdown -->
      <div class="col-md-4">
        <select id="gameDropdown" class="form-select">
          <option value="">All Games</option>
        </select>
      </div>
    </div>

    <!-- Leaderboard Table -->
    <div id="leaderboard" class="leaderboard-card card shadow-sm">
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Game</th>
              <th>Wins</th>
              <th>Losses</th>
              <th>Draws</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const allGames = [
      "Cricket", "Football", "Hockey", "Volleyball", "Basketball", "Baseball", "Rugby", "Kho-Kho", "Kabaddi",
      "Track & Field (Athletics)", "High Jump", "Long Jump", "Javelin Throw", "Shot Put", "Discus Throw", "Marathon",
      "Archery", "Skating", "Horse Riding", "Cycling", "Golf", "Surfing", "Skateboarding", "Mountain Biking", "Badminton"
    ];

    function loadEvents() {
      fetch("/events")
        .then(res => res.json())
        .then(events => {
          const eventDropdown = document.getElementById("eventDropdown");
          eventDropdown.innerHTML = "";
          events.forEach(ev => {
            const option = document.createElement("option");
            option.value = ev.rid;
            option.textContent = `${ev.event} (${ev.sports})`;
            eventDropdown.appendChild(option);
          });
          if (events.length > 0) {
            eventDropdown.value = events[0].rid;
            loadGames();
            loadLeaderboard();
          }
        })
        .catch(err => console.error("Error loading events:", err));
    }

    function loadGames() {
      const gameDropdown = document.getElementById("gameDropdown");
      gameDropdown.innerHTML = `<option value="">All Games</option>`;
      allGames.forEach(game => {
        const option = document.createElement("option");
        option.value = game;
        option.textContent = game;
        gameDropdown.appendChild(option);
      });
    }

    function loadLeaderboard() {
      const eventId = document.getElementById("eventDropdown").value;
      const game = document.getElementById("gameDropdown").value;
      let url = `/leaderboard?eventId=${eventId}`;
      if (game) {
        url += `&game=${encodeURIComponent(game)}`;
      }

      fetch(url)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("leaderboardBody");
          tbody.innerHTML = "";
          data.forEach((player, index) => {
            const row = `
              <tr>
                <td>${index + 1}</td>
                <td>
                  <img src="${player.profilepic || 'default-pic.png'}" class="profile-pic me-2">
                  ${player.name}
                </td>
                <td>${player.games || '-'}</td>
                <td>${player.wins || 0}</td>
                <td>${player.losses || 0}</td>
                <td>${player.draws || 0}</td>
                <td>${player.total_games || 0}</td>
              </tr>
            `;
            tbody.innerHTML += row;
          });
        })
        .catch(err => console.error("Error loading leaderboard:", err));
    }

    // Event listeners
    document.getElementById("eventDropdown").addEventListener("change", loadLeaderboard);
    document.getElementById("gameDropdown").addEventListener("change", loadLeaderboard);

    // Initial load
    loadEvents();
  </script>
</body>
</html>
