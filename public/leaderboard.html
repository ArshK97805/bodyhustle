<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .profile-pic {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }
    .leaderboard-card {
      max-width: 800px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container my-4">
    <h2 class="text-center fw-bold mb-4">🏆 Leaderboard</h2>
    <div id="leaderboard" class="leaderboard-card card shadow-sm">
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Game</th>
              <th>Wins</th>
              <th>Losses</th>
              <th>Draws</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    fetch("/leaderboard")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("leaderboardBody");
        tbody.innerHTML = "";
        data.forEach((player, index) => {
          const row = `
            <tr>
              <td>${index + 1}</td>
              <td>
                <img src="${player.profilepic || 'default-pic.png'}" class="profile-pic me-2">
                ${player.name}
              </td>
              <td>${player.games || '-'}</td>
              <td>${player.wins || 0}</td>
              <td>${player.losses || 0}</td>
              <td>${player.draws || 0}</td>
              <td>${player.total_games || 0}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      })
      .catch(err => {
        console.error("Error loading leaderboard:", err);
      });
  </script>
</body>
</html>
